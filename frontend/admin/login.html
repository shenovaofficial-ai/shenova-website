<!DOCTYPE html><html><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin · Shenova</title>
<link rel="stylesheet" href="../css/admin.css">
</head><body style="display:flex;align-items:center;justify-content:center;min-height:100vh">
<form onsubmit="adminLogin(event)" class="panel" style="width:380px">
  <h2 style="font-family:'Cormorant Garamond',serif;font-size:32px;letter-spacing:.3em;text-align:center;margin-bottom:24px">SHENOVA</h2>
  <input name="email" type="email" placeholder="Email" required>
  <input name="password" type="password" placeholder="Password" required>
  <button style="width:100%">Sign In</button>
</form>
<script src="../js/config.js"></script>
<script>
async function adminLogin(e) {
  e.preventDefault();

  const form    = e.target;
  const btn     = form.querySelector('button');
  const email   = form.email.value.trim();
  const password = form.password.value;

  // Button ko loading state mein dalo
  btn.textContent = 'Signing in…';
  btn.disabled = true;

  try {
    const res = await fetch(window.API_BASE + '/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });

    const data = await res.json();

    if (!res.ok) {
      alert(data.error || 'Invalid credentials');
      btn.textContent = 'Sign In';
      btn.disabled = false;
      return;
    }

    // Token aur role save karo
    localStorage.setItem('admin_token', data.token);
    localStorage.setItem('admin_role',  data.role);
    localStorage.setItem('admin_name',  data.name);

    // Dashboard pe bhejo
    window.location.href = 'dashboard.html';

  } catch (err) {
    console.error(err);
    alert('Server error. Please try again.');
    btn.textContent = 'Sign In';
    btn.disabled = false;
  }
}
</script>
<script src="../js/admin.js"></script>
</body></html>
